<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>规则库 · 丰贸电商平台</title>
<link rel="stylesheet" href="/assets/style.css?v=20261031">
<style>
  .filters { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .filters .input { width: 260px; }
  .filters .select { width: auto; min-width: 120px; }
  .clause {
    padding: 16px 18px; border-bottom: 1px solid var(--border);
  }
  .clause:last-child { border-bottom: none; }
  .clause-top { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .clause-no {
    font-family: ui-monospace, Consolas, monospace; font-size: 12px; font-weight: 600;
    padding: 1px 8px; border-radius: 5px; background: var(--primary-weak); color: var(--primary);
  }
  .clause-doc { font-size: 13px; font-weight: 600; }
  .clause-body { font-size: 13.5px; line-height: 1.85; color: var(--text-2); }
  .clause-foot { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 9px; font-size: 11.5px; color: var(--muted); }
  .pager { display: flex; gap: 8px; align-items: center; justify-content: center; padding: 16px; }
  .score-bar { height: 3px; border-radius: 2px; background: var(--border); overflow: hidden; width: 54px; }
  .score-bar i { display: block; height: 100%; background: var(--primary); }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">规</div>
      <div><div class="brand-txt">丰贸电商平台</div><div class="brand-sub" id="ruleVer">规则库 —</div></div>
    </div>
    <nav class="nav">
      <a class="nav-item" href="/app" data-nav="/app"><span class="ico">◈</span>工作台</a>
      <a class="nav-item" href="/dashboard" data-nav="/dashboard"><span class="ico">▤</span>经营看板</a>

      <a class="nav-item active" href="/rules" data-nav="/rules"><span class="ico">▤</span>规则库</a>
      <a class="nav-item" href="/service" data-nav="/service"><span class="ico">☏</span>客服工作台</a>
      <a class="nav-item" href="/cs" data-nav="/cs"><span class="ico">◔</span>咨询窗口</a>
      <a class="nav-item" href="/orders" data-nav="/orders"><span class="ico">▦</span>我的订单</a>

      <a class="nav-item" href="/dispute" data-nav="/dispute"><span class="ico">⚖</span>纠纷中心</a>
      <a class="nav-item" href="/platform" data-nav="/platform"><span class="ico">⛨</span>平台监管</a>
      <a class="nav-item" href="/settings" data-nav="/settings"><span class="ico">⚙</span>设置</a>
      <a class="nav-item" href="/admin" data-nav="/admin"><span class="ico">⛨</span>系统管理</a>
    </nav>
    <div class="sidebar-foot"><div class="user-chip" id="userChip"></div></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h2>规则库</h2>
      <div class="spacer"></div>
      <span class="pill">共 <b id="totalClauses">—</b> 条</span>
    </div>

    <div class="content">
      <div class="grid-4 mb-16" id="statCards"></div>

      <div class="card">
        <div class="card-head">
          <h3>条款检索</h3>
          <span class="small muted" id="modeHint">按相关度排序，支持自然语言</span>
        </div>
        <div class="card-body" style="padding-bottom:12px">
          <div class="filters">
            <input class="input" id="kw" placeholder="输入关键词或整句问题，回车检索">
            <select class="select" id="docSel"><option value="">全部文档</option></select>
            <select class="select" id="riskSel">
              <option value="">全部风险</option>
              <option value="L1">L1 低风险</option>
              <option value="L2">L2 中风险</option>
              <option value="L3">L3 高风险</option>
            </select>
            <button class="btn" id="btnReset">重置</button>
          </div>
        </div>
        <div id="list"></div>
        <div class="pager" id="pager"></div>
      </div>
    </div>
  </main>
</div>

<script src="/assets/api.js?v=20261031"></script>
<script>
let me = null, page = 1, size = 15, total = 0, keyword = "", mode = "browse";

init();

async function init() {
  me = await initShell();
  const st = await api("/api/rules/stats", { quiet: true }).catch(() => null);
  if (st) {
    $("#totalClauses").textContent = st.clauses;
    const risk = st.risk || {};
    $("#statCards").innerHTML = `
      ${stat("法规文档", st.docs, "部/份")}
      ${stat("现行条款", st.clauses, "条")}
      ${stat("高风险条款", risk.L3 || 0, "条 · 强制转人工")}
      ${stat("中风险条款", risk.L2 || 0, "条 · 需附免责")}`;
  }
  const docs = await api("/api/rules/docs", { quiet: true }).catch(() => ({ items: [] }));
  $("#docSel").insertAdjacentHTML("beforeend",
    (docs.items || []).map(d => `<option value="${d.id}">${esc(d.name)}（${d.clauses}）</option>`).join(""));

  load();
}

function stat(k, v, s) {
  return `<div class="card stat"><div class="k">${esc(k)}</div><div class="v">${v}</div><div class="s">${esc(s)}</div></div>`;
}

async function load() {
  const list = $("#list");
  list.innerHTML = `<div class="empty"><span class="spinner"></span> 加载中…</div>`;

  const kw = $("#kw").value.trim();
  const docId = $("#docSel").value;
  const risk = $("#riskSel").value;

  if (kw) {
    mode = "search";
    $("#modeHint").textContent = "检索结果按相关度排序";
    const d = await api("/api/rules/search", { method: "POST", body: { query: kw, top_k: 20 }, quiet: true })
      .catch(() => ({ items: [] }));
    $("#pager").innerHTML = "";
    renderItems(d.items || [], true);
    return;
  }

  mode = "browse";
  $("#modeHint").textContent = "按文档顺序浏览";
  let url = `/api/rules/clauses?page=${page}&size=${size}`;
  if (docId) url += `&doc_id=${docId}`;
  if (risk) url += `&risk=${risk}`;
  const d = await api(url, { quiet: true }).catch(() => ({ items: [], total: 0 }));
  total = d.total || 0;
  renderItems(d.items || [], false);
  renderPager();
}

function renderItems(items, isSearch) {
  const list = $("#list");
  if (!items.length) {
    list.innerHTML = `<div class="empty"><div class="big">▤</div><div>没有找到符合条件的条款</div>
      <div class="small">换个关键词，或清空筛选条件</div></div>`;
    return;
  }
  list.innerHTML = items.map(c => `
    <div class="clause">
      <div class="clause-top">
        <span class="clause-no">${esc(c.clause_no)}</span>
        <span class="clause-doc">《${esc(c.doc_name)}》</span>
        ${c.risk_level ? `<span class="badge ${esc(c.risk_level)}">${esc(c.risk_level)}</span>` : ""}
        ${c.clause_path ? `<span class="small muted">${esc(c.clause_path)}</span>` : ""}
      </div>
      <div class="clause-body">${esc(c.content)}</div>
      <div class="clause-foot">
        <span>生效 ${esc(c.effective_from || "—")}</span>
        ${isSearch ? `<span style="display:flex;gap:6px;align-items:center">相关度
          <span class="score-bar"><i style="width:${Math.min(100, Number(c.score || 0) * 100)}%"></i></span>
          ${Number(c.score || 0).toFixed(3)}</span>` : ""}
        ${c.source_url ? `<a href="${esc(c.source_url)}" target="_blank" rel="noopener">官方原文</a>` : ""}
      </div>
    </div>`).join("");
}

function renderPager() {
  const pages = Math.max(1, Math.ceil(total / size));
  $("#pager").innerHTML = `
    <button class="btn btn-sm" id="prev" ${page <= 1 ? "disabled" : ""}>上一页</button>
    <span class="small muted">第 ${page} / ${pages} 页 · 共 ${total} 条</span>
    <button class="btn btn-sm" id="next" ${page >= pages ? "disabled" : ""}>下一页</button>`;
  $("#prev").onclick = () => { if (page > 1) { page--; load(); } };
  $("#next").onclick = () => { if (page < pages) { page++; load(); } };
}

$("#kw").addEventListener("keydown", e => { if (e.key === "Enter") { page = 1; load(); } });
$("#docSel").addEventListener("change", () => { page = 1; $("#kw").value = ""; load(); });
$("#riskSel").addEventListener("change", () => { page = 1; $("#kw").value = ""; load(); });
$("#btnReset").addEventListener("click", () => {
  $("#kw").value = ""; $("#docSel").value = ""; $("#riskSel").value = "";
  page = 1; load();
});
</script>
</body>
</html>
